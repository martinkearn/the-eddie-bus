name: Deploy to Krystal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_BOOKING_API_ENDPOINT: ${{ secrets.NEXT_PUBLIC_BOOKING_API_ENDPOINT }}
        run: npm run build

      - name: Check build output
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -d out/_next/static
          test -f backend/public/bootstrap_api.php
          test -d backend/src
          test -d backend/sql
          test -d backend/templates/emails

      - name: Install FTP client
        run: sudo apt-get install --no-install-recommends -y lftp

      - name: Upload to Krystal
        env:
          FTP_SERVER: ${{ secrets.KRYSTAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KRYSTAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KRYSTAL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?KRYSTAL_FTP_SERVER is not configured}"
          : "${FTP_USERNAME:?KRYSTAL_FTP_USERNAME is not configured}"
          : "${FTP_PASSWORD:?KRYSTAL_FTP_PASSWORD is not configured}"

          timeout 600 lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "ftp://$FTP_SERVER:21" <<'LFTP_COMMANDS'
          set cmd:fail-exit yes
          set ftp:passive-mode yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:timeout 30
          set net:max-retries 2

          mirror --reverse --delete --parallel=4 ./out/_next/ /public_html/_next/
          mirror --reverse --parallel=4 --exclude-glob _next/** ./out/ /public_html/
          mirror --reverse --delete --parallel=4 --exclude-glob .DS_Store ./backend/public/ /public_html/api/
          mirror --reverse --delete --parallel=4 ./backend/src/ /booking-api/src/
          mirror --reverse --delete --parallel=4 ./backend/sql/ /booking-api/sql/
          mirror --reverse --delete --parallel=4 --exclude-glob .DS_Store ./backend/templates/ /booking-api/templates/
          bye
          LFTP_COMMANDS