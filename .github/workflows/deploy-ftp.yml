name: Deploy src to Krystal FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: krystal-ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload src via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Mirror src to public_html
        env:
          FTP_SERVER: ${{ secrets.KRYSTAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KRYSTAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KRYSTAL_FTP_PASSWORD }}
        run: |
          lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -p 21 \
            "$FTP_SERVER" \
            -e "set ftp:ssl-allow no; set ftp:passive-mode on; mirror --reverse --delete --verbose ./src/ /public_html/; bye"
