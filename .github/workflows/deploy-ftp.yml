name: Deploy static export to Krystal FTP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-krystal-ftp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload site + API
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build static export
        env:
          NEXT_PUBLIC_BOOKING_API_ENDPOINT: ${{ secrets.NEXT_PUBLIC_BOOKING_API_ENDPOINT }}
        run: npm run build

      - name: Verify export artifact layout
        run: |
          test -d out/_next/static
          test -f out/index.html

      - name: Log deploy fingerprint
        run: |
          echo "Deploying commit: $GITHUB_SHA"
          grep -o 'Last updated:[^<]*' out/index.html | head -n 1

      - name: Install lftp
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sudo apt-get install -y lftp

      - name: Verify email templates directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -d backend/templates/emails
          find backend/templates/emails -type f -name '*.html' | sort

      - name: Mirror out to public_html
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.KRYSTAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KRYSTAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KRYSTAL_FTP_PASSWORD }}
        run: |
          timeout 300 lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "$FTP_SERVER" \
            -e "set cmd:fail-exit yes; set ftp:passive-mode on; set ssl:verify-certificate no; set net:timeout 10; mirror --reverse ./out/_next/ /public_html/_next/; mirror --reverse --exclude-glob _next/** ./out/ /public_html/; bye"

      - name: Mirror PHP API public files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.KRYSTAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KRYSTAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KRYSTAL_FTP_PASSWORD }}
        run: |
          timeout 300 lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "$FTP_SERVER" \
            -e "set cmd:fail-exit yes; set ftp:passive-mode on; set ssl:verify-certificate no; set net:timeout 10; mirror --reverse ./backend/public/ /public_html/api/; bye"

      - name: Mirror PHP API runtime files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.KRYSTAL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.KRYSTAL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.KRYSTAL_FTP_PASSWORD }}
        run: |
          timeout 300 lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "$FTP_SERVER" \
            -e "set cmd:fail-exit yes; set ftp:passive-mode on; set ssl:verify-certificate no; set net:timeout 10; mirror --reverse ./backend/src/ /booking-api/src/; mirror --reverse ./backend/sql/ /booking-api/sql/; mirror --reverse ./backend/templates/emails/ /booking-api/templates/emails/; bye"

      - name: Show deploy results
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "=== Local files deployed ==="
          find ./out -type f | wc -l
          echo "files copied"
